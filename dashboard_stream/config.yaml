# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
#
# NOTE: Home Assistant renamed "Add-ons" to "Apps" in Supervisor 2026.07.
# This manifest uses the current App schema. Supervisor's legacy Add-on
# store/API still installs it the same way, so this repository works
# whether your Home Assistant refers to it as an "Add-on" or an "App".
---
name: "Dashboard Stream Cam"
version: "1.9.0"
slug: "dashboard_stream"
description: >-
  Renders a Home Assistant dashboard headlessly and publishes it as an
  authenticated ONVIF/RTSP network camera, so it can be added to UniFi
  Protect (or any ONVIF/RTSP client) as a third-party camera.
url: "https://github.com/internerd/ha-dashboard-stream/tree/main/dashboard_stream"
# image intentionally omitted: Supervisor builds this app locally from the
# Dockerfile in this repository using build.yaml, so installation only ever
# needs this GitHub repository - no external container registry required.
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Dashboard Stream
# Points at the public ONVIF-port /health endpoint (0.0.0.0-bound), not the
# ingress panel: the ingress panel only answers the Supervisor's own Docker
# network (see SECURITY.md), and [HOST] is not guaranteed to resolve to an
# address inside it.
watchdog: "http://[HOST]:[PORT:8080]/health"
options:
  ha_url: "http://homeassistant.local:8123"
  ha_long_lived_token: ""
  dashboard_path: "lovelace/default_view"
  dashboard_custom_url: ""
  resolution: "1920x1080"
  framerate: 15
  substream: true
  audio_track: "none"
  h264_profile: "baseline"
  color_scheme: "auto"
  render_wait: 8
  reload_interval: 3600
  rtsp_port: 8554
  onvif_port: 8080
  onvif_extra_port: 0
  onvif_enabled: true
  onvif_device_name: "Dashboard Stream Cam"
  advertise_ip: ""
  stream_username: "viewer"
  stream_password: ""
  watchdog_interval: 15
  stall_timeout: 45
  log_level: "info"
schema:
  ha_url: "url"
  ha_long_lived_token: "password?"
  dashboard_path: "str"
  dashboard_custom_url: "str?"
  resolution: "list(1280x720|1366x768|1920x1080|1024x600|800x480)"
  framerate: "int(1,30)"
  substream: "bool"
  audio_track: "list(silent|none)"
  h264_profile: "list(baseline|main)"
  color_scheme: "list(auto|dark|light)"
  render_wait: "int(1,60)"
  reload_interval: "int(0,86400)"
  rtsp_port: "port"
  onvif_port: "port"
  onvif_extra_port: "int(0,65535)"
  onvif_enabled: "bool"
  onvif_device_name: "str"
  # Empty (auto-detect) or a plain IPv4 address.
  advertise_ip: "match(^$|^(\\d{1,3}\\.){3}\\d{1,3}$)"
  stream_username: "str"
  stream_password: "password"
  watchdog_interval: "int(5,300)"
  stall_timeout: "int(10,600)"
  log_level: "list(debug|info|warning|error)"
