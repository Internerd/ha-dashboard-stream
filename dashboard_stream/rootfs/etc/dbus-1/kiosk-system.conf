<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal system bus for the kiosk container.

  Chromium unconditionally probes the system bus (UPower for battery state,
  NetworkManager for connectivity, the secret service, ...). Without a bus it
  logs a wall of "Failed to connect to socket /run/dbus/system_bus_socket"
  and "Failed to call method: org.freedesktop.DBus.NameHasOwner" errors and
  retries on every check. With a bus present the probes simply answer "that
  service does not exist" and stay quiet.

  Deliberately self-contained (no <includedir> of the distro policy files):
  nothing outside this container talks to this bus, and it must keep working
  regardless of what the base image ships.
-->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
  <limit name="max_incoming_bytes">33554432</limit>
  <limit name="max_message_size">33554432</limit>
</busconfig>
