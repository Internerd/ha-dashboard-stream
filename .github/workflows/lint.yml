name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate YAML files parse
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml, pathlib
          failed = False
          for path in pathlib.Path(".").rglob("*.y*ml"):
              if ".github" in path.parts and path.name != "lint.yml":
                  pass
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./dashboard_stream/rootfs"
          severity: warning

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile check
        run: python -m py_compile dashboard_stream/app/*.py

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dashboard_stream/Dockerfile
          failure-threshold: error
