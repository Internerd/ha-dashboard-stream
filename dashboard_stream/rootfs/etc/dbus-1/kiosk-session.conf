<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal session bus for the kiosk container.

  Chromium also wants a *session* bus. With DBUS_SESSION_BUS_ADDRESS unset it
  falls back to the "autolaunch:" address, which its bundled libdbus cannot
  parse - hence the repeated "Could not parse server address: Unknown address
  type" errors. Pointing it at this bus makes that go away.

  Deliberately self-contained (no <includedir> of the distro policy files):
  nothing outside this container talks to this bus, and it must keep working
  regardless of what the base image ships.
-->
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/dbus/session_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
  <limit name="max_incoming_bytes">33554432</limit>
  <limit name="max_message_size">33554432</limit>
</busconfig>
